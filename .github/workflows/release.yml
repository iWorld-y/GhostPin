name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_release: ${{ steps.version.outputs.is_release }}

    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Validate and expose version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < script/VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号格式错误: script/VERSION=$version" >&2
            exit 1
          fi

          tag=""
          is_release=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            tag_version="${tag#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "版本不一致: tag=$tag, script/VERSION=$version" >&2
              exit 1
            fi
            is_release=true
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "is_release=$is_release"
          } >> "$GITHUB_OUTPUT"

  build-macos:
    needs: metadata
    runs-on: macos-15

    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Print build toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run core checks
        run: swift run GhostPinCoreChecks

      - name: Build and package DMG
        env:
          GHOST_PIN_VERSION: ${{ needs.metadata.outputs.version }}
        run: ./script/package_dmg.sh

      - name: Verify app and DMG
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          app_path="dist/GhostPin.app"
          dmg_path="dist/GhostPin-${VERSION}.dmg"
          cli_path="$app_path/Contents/MacOS/ghostpin-cli"

          test -f "$dmg_path"
          test -x "$app_path/Contents/MacOS/GhostPin"
          test -x "$cli_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          mount_point="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            rmdir "$mount_point" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg_path"
          test -x "$mount_point/GhostPin.app/Contents/MacOS/GhostPin"
          test -x "$mount_point/GhostPin.app/Contents/MacOS/ghostpin-cli"
          codesign --verify --deep --strict --verbose=2 "$mount_point/GhostPin.app"
          hdiutil detach "$mount_point"
          rmdir "$mount_point"
          trap - EXIT

          hdiutil verify "$dmg_path"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostPin-${{ needs.metadata.outputs.version }}-macos
          path: dist/GhostPin-${{ needs.metadata.outputs.version }}.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    needs: metadata
    runs-on: windows-2025

    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Print build toolchain
        shell: pwsh
        run: dotnet --info

      - name: Run Windows tests
        shell: pwsh
        run: dotnet test windows/GhostPin.Windows.sln --configuration Release -p:NuGetAudit=false

      - name: Build and package Windows EXE
        shell: pwsh
        run: ./script/package_windows.ps1

      - name: Smoke-test Windows EXE
        shell: pwsh
        run: |
          $exePath = Join-Path $env:GITHUB_WORKSPACE "dist/GhostPin-${{ needs.metadata.outputs.version }}-windows-x64.exe"
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
            throw "找不到 Windows 发布产物：$exePath"
          }

          $process = $null
          try {
            $process = Start-Process -FilePath $exePath -WorkingDirectory (Split-Path $exePath) -PassThru
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              throw "Windows 发布产物启动后意外退出，退出码：$($process.ExitCode)"
            }
          }
          finally {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostPin-${{ needs.metadata.outputs.version }}-windows-x64
          path: dist/GhostPin-${{ needs.metadata.outputs.version }}-windows-x64.exe
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [metadata, build-macos, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.metadata.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Download macOS DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: GhostPin-${{ needs.metadata.outputs.version }}-macos
          path: release-assets/macos

      - name: Download Windows EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: GhostPin-${{ needs.metadata.outputs.version }}-windows-x64
          path: release-assets/windows

      - name: Verify release assets
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          dmg="release-assets/macos/GhostPin-${VERSION}.dmg"
          exe="release-assets/windows/GhostPin-${VERSION}-windows-x64.exe"
          test -f "$dmg"
          test -f "$exe"

          actual="$(find release-assets -type f -print | sed 's#.*/##' | sort)"
          expected="$(printf '%s\n' "GhostPin-${VERSION}.dmg" "GhostPin-${VERSION}-windows-x64.exe" | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "发布资产不符合预期:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "错误: Release $TAG 已存在,拒绝覆盖已有发布物" >&2
            exit 1
          fi

          notes_file="$(mktemp)"
          awk -v ver="$VERSION" '
            BEGIN { in_section = 0 }
            /^## / {
              if (!in_section && $2 == ("v" ver)) { in_section = 1; next }
              if (in_section) exit
            }
            in_section { print }
          ' CHANGELOG.md > "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            echo "Agent native 版 ${VERSION}。任务操作通过随应用分发的 CLI 完成,App 负责展示与通知。" > "$notes_file"
          fi

          gh release create "$TAG" \
            "release-assets/macos/GhostPin-${VERSION}.dmg" \
            "release-assets/windows/GhostPin-${VERSION}-windows-x64.exe" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "GhostPin ${VERSION}" \
            --notes-file "$notes_file"
