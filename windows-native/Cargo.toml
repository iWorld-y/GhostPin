[package]
name = "ghostpin-native"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "ghostpin_native"
path = "src/lib.rs"

[[bin]]
name = "ghostpin-native"
path = "src/main.rs"

[[bin]]
name = "ghostpin-native-core-checks"
path = "src/bin/core_checks.rs"

[dependencies.windows]
version = "0.61.3"
features = [
    "Data_Json",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_SystemInformation",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies.windows-numerics]
version = "0.2.0"

[profile.dev]
debug = 1

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
